name: Supabase - Apply Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Aplicar migration pendente
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations pendentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref cuhxtopqflgdotzcbhkk
          supabase db push
