name: Supabase - Repair Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Registrar migration já aplicada
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Registrar fundacao como aplicada
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref cuhxtopqflgdotzcbhkk
          supabase migration repair --status applied 20260929120000
