# CI do Global Food Guide (ADR 0012).
#
# Só VERIFICA o projeto: não publica, não faz deploy, não usa EAS nem Vercel, não acessa
# nenhum projeto Supabase remoto e não usa nenhum secret. Nunca altera a branch main.
# O job "Banco de dados" sobe um Supabase LOCAL e temporário (Docker) só para testar.
#
# As actions são fixadas pelo SHA do commit (versão no comentário). Para atualizar uma
# action, troque o SHA e o comentário juntos — veja docs/CI.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permissão mínima: só leitura do código.
permissions:
  contents: read

# Um novo envio para o mesmo pull request cancela a verificação antiga.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sem coleta de dados de uso das ferramentas.
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: Verificações (format, tipos, lint, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pnpm (versão do packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node.js (versão do .nvmrc) com cache do pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências (lockfile travado)
        run: pnpm install --frozen-lockfile

      - name: Formatação (Prettier)
        run: pnpm format:check

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Testes (Vitest)
        run: pnpm test

      - name: Build (painel Next.js)
        run: pnpm build

  mobile-bundle:
    name: Empacotamento do app (expo export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pnpm (versão do packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node.js (versão do .nvmrc) com cache do pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências (lockfile travado)
        run: pnpm install --frozen-lockfile

      # Gera o pacote JavaScript de Android e iOS só para confirmar que o Metro consegue
      # empacotar o app. O resultado fica numa pasta temporária e é descartado.
      - name: Empacotar Android e iOS
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"

      - name: Resumo do pacote gerado
        run: |
          echo "Arquivos gerados:"
          find "$RUNNER_TEMP/expo-export/_expo/static/js" -name '*.hbc' -exec ls -lh {} \;

  # Aplica todas as migrations num Supabase local e temporário (Docker, sem secrets) e roda
  # os testes pgTAP de RLS/segurança de supabase/tests/ (ADR 0012, atualização da ADR 0015).
  database:
    name: Banco de dados (migrations + testes pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI (versão fixa)
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # Só o necessário para o teste: banco, autenticação (cria auth.users), API.
      - name: Subir Supabase local (aplica migrations e seed)
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Verificar funções do banco (db lint)
        run: supabase db lint --level warning --fail-on error

      - name: Testes de RLS e segurança (pgTAP)
        run: supabase test db

      - name: Desligar Supabase local
        if: always()
        run: supabase stop --no-backup
