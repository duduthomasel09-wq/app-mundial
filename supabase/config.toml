# Configuração do Supabase CLI para o ambiente LOCAL (`supabase start`).
# Documentação: https://supabase.com/docs/guides/local-development/cli/config
#
# Este arquivo não tem nenhuma chave ou senha. O projeto na nuvem (desenvolvimento)
# é conectado com `supabase link` — veja docs/SUPABASE.md.

# Nome do projeto local (usado nos contêineres do Docker).
project_id = "app-mundial"

[api]
enabled = true
port = 54321
# Esquemas expostos pela API. O app só acessa o esquema `public`.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Mesma versão principal do Postgres dos projetos novos na nuvem.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Dados iniciais aplicados em `supabase db reset` (em ordem alfabética).
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Caixa de e-mails falsa para testar e-mails de login localmente.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Painel admin em desenvolvimento. O app mobile ganha suas URLs quando o login for implementado.
site_url = "http://127.0.0.1:3000"
# Destinos permitidos nos links de e-mail. `/auth/confirmar` recebe o link de recuperação de
# senha do painel (ADR 0017) — o painel monta o link com NEXT_PUBLIC_ADMIN_URL.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/confirmar",
  "http://127.0.0.1:3000/auth/confirmar",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# E-mail de recuperação de senha (ADR 0017): o link traz `token_hash` (funciona em qualquer
# navegador/aparelho) e aponta para `{{ .RedirectTo }}` = NEXT_PUBLIC_ADMIN_URL/auth/confirmar.
# Só vale no ambiente local; no projeto de desenvolvimento, o mesmo texto é configurado no
# site do Supabase (docs/SUPABASE.md, seção 5.4).
[auth.email.template.recovery]
subject = "Redefinir sua senha — Global Food Guide"
content_path = "./supabase/templates/recovery.html"

# E-mail de confirmação do cadastro no app (ADR 0018): traz o **código de 6 dígitos**
# (`{{ .Token }}`), digitado no app — sem links que abrem o app. Só vale no ambiente local
# (aqui a confirmação fica desligada; ligue-a só para testar). No projeto de
# desenvolvimento, o mesmo texto é configurado no site do Supabase (docs/SUPABASE.md, 5.5).
[auth.email.template.confirmation]
subject = "Seu código de confirmação — Global Food Guide"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

# Verificação de funcionamento — pública de propósito (não expõe nenhum dado).
[functions.health]
verify_jwt = false
