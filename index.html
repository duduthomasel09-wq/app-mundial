<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Mundial</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#f7f5f0; color:#222; }
    header { padding:48px 20px; text-align:center; background:#1f6f5c; color:#fff; }
    h1 { margin:0 0 8px; font-size:2.2rem; }
    main { max-width:720px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; }
    .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin:0 0 6px; font-size:1.2rem; }
    footer { text-align:center; padding:24px; color:#777; font-size:.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>🌍 App Mundial</h1>
    <p>Seu guia de comida pelo mundo</p>
  </header>
  <main>
    <div class="card"><h2>🍝 Pratos típicos</h2><p>Conheça a comida mais famosa de cada país.</p></div>
    <div class="card"><h2>📍 Onde comer</h2><p>Encontre restaurantes perto de você.</p></div>
    <div class="card"><h2>📖 Receitas</h2><p>Aprenda a fazer em casa, passo a passo.</p></div>
  </main>
  <footer>Em construção 🚧</footer>
</body>
</html>
